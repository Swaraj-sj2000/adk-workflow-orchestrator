<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>SynRA logo</title>
  <desc>SynRA orchestrator logo — central command node radiating to task nodes, bold metallic wordmark</desc>

  <!-- outer dashed orbit ring -->
  <circle cx="150" cy="150" r="88" fill="none" stroke="rgb(208,208,232)" stroke-width="0.7" stroke-dasharray="3,5"/>
  <!-- inner subtle ring -->
  <circle cx="150" cy="150" r="52" fill="none" stroke="rgb(224,224,240)" stroke-width="1"/>

  <!-- dim spokes -->
  <line x1="150" y1="150" x2="194" y2="226" stroke="rgb(208,208,232)" stroke-width="1"/>
  <line x1="150" y1="150" x2="106" y2="226" stroke="rgb(208,208,232)" stroke-width="1"/>
  <line x1="150" y1="150" x2="62"  y2="150" stroke="rgb(208,208,232)" stroke-width="1"/>

  <!-- live spokes (top 3) -->
  <line x1="150" y1="150" x2="238" y2="150" stroke="rgb(48,48,160)" stroke-width="1.8"/>
  <line x1="150" y1="150" x2="106" y2="74"  stroke="rgb(48,48,160)" stroke-width="1.8"/>
  <line x1="150" y1="150" x2="194" y2="74"  stroke="rgb(48,48,160)" stroke-width="1.8"/>

  <!-- tick marks -->
  <line x1="150" y1="62"  x2="150" y2="56"  stroke="rgb(48,48,160)" stroke-width="1.2"/>
  <line x1="150" y1="238" x2="150" y2="244" stroke="rgb(48,48,160)" stroke-width="1.2"/>
  <line x1="62"  y1="150" x2="56"  y2="150" stroke="rgb(48,48,160)" stroke-width="1.2"/>
  <line x1="238" y1="150" x2="244" y2="150" stroke="rgb(48,48,160)" stroke-width="1.2"/>

  <!-- dim satellite nodes (bottom half) -->
  <circle cx="194" cy="226" r="8" fill="rgb(248,248,252)" stroke="rgb(200,200,224)" stroke-width="1"/>
  <circle cx="194" cy="226" r="4" fill="rgb(200,200,224)"/>
  <circle cx="106" cy="226" r="8" fill="rgb(248,248,252)" stroke="rgb(200,200,224)" stroke-width="1"/>
  <circle cx="106" cy="226" r="4" fill="rgb(200,200,224)"/>
  <circle cx="62"  cy="150" r="8" fill="rgb(248,248,252)" stroke="rgb(200,200,224)" stroke-width="1"/>
  <circle cx="62"  cy="150" r="4" fill="rgb(200,200,224)"/>

  <!-- active satellite nodes (top half) -->
  <circle cx="238" cy="150" r="11" fill="rgb(244,244,252)" stroke="rgb(48,48,160)" stroke-width="1.4"/>
  <circle cx="238" cy="150" r="6"  fill="rgb(48,48,160)"/>
  <circle cx="106" cy="74"  r="11" fill="rgb(244,244,252)" stroke="rgb(48,48,160)" stroke-width="1.4"/>
  <circle cx="106" cy="74"  r="6"  fill="rgb(48,48,160)"/>
  <circle cx="194" cy="74"  r="11" fill="rgb(244,244,252)" stroke="rgb(48,48,160)" stroke-width="1.4"/>
  <circle cx="194" cy="74"  r="6"  fill="rgb(48,48,160)"/>

  <!-- central command node -->
  <circle cx="150" cy="150" r="26" fill="rgb(244,244,252)" stroke="rgb(48,48,160)" stroke-width="2"/>
  <circle cx="150" cy="150" r="17" fill="rgb(48,48,160)"/>
  <circle cx="150" cy="150" r="8"  fill="rgb(244,244,252)"/>
  <circle cx="150" cy="150" r="3"  fill="rgb(48,48,160)"/>

  <!-- wordmark -->
  <text x="290" y="172" font-family="sans-serif" font-size="78" font-weight="500" letter-spacing="-3">
    <tspan fill="rgb(10,10,32)">Syn</tspan><tspan fill="rgb(48,48,160)">RA</tspan>
  </text>
  <text x="294" y="200" font-family="sans-serif" font-size="11" font-weight="400" letter-spacing="0.24em" fill="rgb(152,152,184)">AI PROJECT MANAGER</text>
</svg>
