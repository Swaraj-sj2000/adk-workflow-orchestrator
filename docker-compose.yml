services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8080"
    environment:
      PORT: 8080
      DATABASE_URL: sqlite:///./app.db
      SECRET_KEY: dev-secret-key-change-me
      ALGORITHM: HS256

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:8080"
    depends_on:
      - backend
